---
name: Release
on:
  push:
    tags: [v*]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    # The signing key and the Central credentials are handed out only after a member of the
    # team approves the run. A tag alone no longer publishes a signed artifact.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
      # The build runs pre-commit through the Maven lifecycle, the same as in ci.yml.
      - name: Install pre-commit
        run: pipx install pre-commit==4.6.1
      # deploy walks the whole lifecycle, so the tests run here and the artifacts published are
      # the ones that were tested. The two profiles come from the generic parent: gpg-sign adds
      # the signatures Central requires, central-publishing uploads and releases the bundle.
      - name: Test and publish to Maven Central
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn --batch-mode -s .mvn/settings.xml -P gpg-sign,central-publishing clean deploy
      - name: Create the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: target/*.jar
          generate_release_notes: true
  bump-to-snapshot:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      # No token in .git/config: the Maven step below runs third-party plugins in the same
      # working copy. PAT_TOKEN reaches the push step only.
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - name: Calculate the next SNAPSHOT version
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "$RELEASE_VERSION"
          echo "NEXT_VERSION=${major}.${minor}.$((patch + 1))-SNAPSHOT" >> "$GITHUB_ENV"
      - name: Update to the SNAPSHOT version
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mvn --batch-mode -s .mvn/settings.xml versions:set \
            -DnewVersion="$NEXT_VERSION" -DgenerateBackupPoms=false
      - name: Commit and push
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "chore: bump to $NEXT_VERSION for development"
          git push "https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
