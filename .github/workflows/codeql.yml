---
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday morning, so a new query release is reported without waiting for a commit.
    - cron: 17 6 * * 1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    # The Java build needs the Polarion artifacts, and a pull request from a fork gets no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          languages: ${{ matrix.language }}
          # The TypeScript sources of the user interface, not the bundle the build writes.
          config: |
            paths-ignore:
              - ui/dist
              - src/main/resources/webapp/timesheet-app/app
      # The Polarion artifacts stay out of the cache, as in ci.yml: a pull request from a fork
      # can restore a cache of main.
      - name: Cache Maven packages
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/com/polarion
            !~/.m2/repository/com/siemens
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      # Only the classes are needed here. The test suites run in ci.yml.
      - name: Build the Java sources
        if: matrix.language == 'java-kotlin'
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: mvn --batch-mode -s .mvn/settings.xml clean compile
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          category: /language:${{ matrix.language }}
