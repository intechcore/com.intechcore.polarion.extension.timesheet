---
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new push to a pull request makes the run in flight pointless. On main every
# commit keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Checks the workflows themselves on every pull request, without a path filter: a required
  # check that does not run blocks the merge.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Expressions, inputs and the shell in run. The image is pinned by digest and brings
      # shellcheck and pyflakes.
      - name: Lint the workflows with actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      # Security audit of the workflows, for example template injection or credentials left in
      # the checkout. Informational findings do not fail.
      - name: Audit the workflows with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          advanced-security: false
          min-severity: low
          version: 1.30.1
  build:
    # A pull request from a fork gets no secrets, so Nexus refuses the Polarion artifacts.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # At job level, so the analysis step can ask whether the token is there. A step cannot read
    # its own env in an if condition, and the secrets context is not available there at all.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # SonarCloud reads the history to tell new code from old.
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
      # Generic formats the generated docs/openapi.json through pre-commit during the build.
      # Without pre-commit the file keeps its raw layout, and the check below fails. The
      # requirements file pins every package by hash.
      - name: Install pre-commit
        run: |
          pip install --only-binary=:all: --require-hashes -r .github/requirements/pre-commit.txt

      # The Polarion artifacts stay out of the cache. Pull requests from forks can
      # restore caches of main, and those artifacts must not leave Nexus.
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/com/polarion
            !~/.m2/repository/com/siemens
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Build and test
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: mvn --batch-mode -s .mvn/settings.xml clean verify
      # The build regenerates docs/openapi.json from the REST annotations.
      - name: Check that docs/openapi.json is up to date
        run: git diff --exit-code -- docs/openapi.json
      # The scanner reuses the tree the step above built, so the project is not compiled twice.
      # Without SONAR_TOKEN the step is skipped, so the analysis starts as soon as the secret
      # is added and no run fails while it is missing.
      - name: Analyze with SonarCloud
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            mvn --batch-mode -s .mvn/settings.xml sonar:sonar \
              -Dsonar.pullrequest.key="$PR_NUMBER" \
              -Dsonar.pullrequest.branch="$HEAD_REF" \
              -Dsonar.pullrequest.base="$BASE_REF" \
              -Dsonar.qualitygate.wait=true
          else
            mvn --batch-mode -s .mvn/settings.xml sonar:sonar -Dsonar.qualitygate.wait=true
          fi
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The same Node.js version that generic installs for the UI build.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # --ignore-scripts: the hooks below only need the Prettier and ESLint packages, so no
      # dependency gets to run a lifecycle script here (SonarCloud rule githubactions:S6505).
      - name: Install the UI dependencies
        run: npm ci --ignore-scripts --prefix ui
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pre-commit
        run: |
          pip install --only-binary=:all: --require-hashes -r .github/requirements/pre-commit.txt
      - name: Run the hooks
        env:
          # no-commit-to-branch fails on main. check-git-config-user-email needs a local identity.
          # The build job already runs the Docker UI tests.
          SKIP: no-commit-to-branch,check-git-config-user-email,ui-test-coverage-docker
        run: pre-commit run --all-files --show-diff-on-failure
  # The pull request title becomes the squash commit, so it is checked together with the commits.
  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
      # The same commitizen version as the commit-msg hook in .pre-commit-config.yaml.
      - name: Install commitizen
        run: |
          pip install --only-binary=:all: --require-hashes -r .github/requirements/commitizen.txt
      - name: Check the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: cz check --message "${PR_TITLE}"
      - name: Check the commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cz check --rev-range "${BASE_SHA}..${HEAD_SHA}"
