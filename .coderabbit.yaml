---
# CodeRabbit is free for public repositories. The value here is not the generic
# review, it is the invariants below: this extension renders inside Polarion, and
# most of its traps are invisible in a diff. See CLAUDE.md.
language: en-US
tone_instructions: Be direct and concise. No preamble, no praise. One idea per sentence. Never use an em-dash.
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    # Dependency bumps merge themselves once the checks pass. A review comment
    # on each one is noise.
    ignore_usernames: [renovate, 'renovate[bot]']
  path_filters: ['!target/**', '!ui/dist/**', '!ui/test/expected/**', '!src/main/resources/webapp/timesheet-app/app/**', '!docs/openapi.json']
  path_instructions:
    - path: src/main/java/**/*.java
      instructions: |-
        - Everything is on jakarta.*. A javax.* EE import fails the build through
          polarion-compatibility-maven-plugin, which reproduces Polarion 2606's own gate. Flag one
          even when the code compiles locally.
        - Require-Bundle is generated from the maven-jar-plugin.* properties of the
          ch.sbb.polarion.extension.generic parent. Flag any attempt to hardcode it in
          META-INF/MANIFEST.MF, which keeps only Bundle-Name, Export-Package and Support-Email.
        - docs/openapi.json is regenerated on every build and CI fails when the build changes it.
          A changed REST signature has to arrive with the regenerated file.
    - path: src/test/java/**/*.java
      instructions: |-
        - Do not assert log output. A behavior is pinned through what it changes, not through the
          logger.
    - path: ui/src/**
      instructions: |-
        - The report renders in an iframe inside a Live Report column, about 690px wide. A change
          that assumes more width is a page-layout change, not a code one.
        - The report tables need both table-layout: fixed and width: max-content. Dropping either
          lets the browser resize the columns per month.
        - useIframeAutoHeight must keep measuring the picker popups. They are position: fixed
          portals on body, so they add nothing to body.scrollHeight and the iframe would cut the
          option list off. Measure the popups only, never a full-viewport overlay.
        - exportPdf imports jspdf-autotable/es on purpose. The CommonJS entry resolves to the
          module namespace under the browser-mode test transform.
        - autoTable applies columnStyles to body cells only. A per-column width that must reach the
          head and foot rows belongs in didParseCell.
        - No bundled font. GenericUiServlet does not serve .ttf and Polarion's CSP blocks data:
          fonts, so a web font would have to be a served woff2.
    - path: ui/{test,e2e}/**
      instructions: |-
        - A test that renders the report must pin the clock, with vi.useFakeTimers({ toFake:
          ['Date'] }) or page.clock.setFixedTime. The period defaults to the current month, so a
          fixture in a fixed month stops rendering once the month rolls over.
        - The visual references in ui/test/expected are pixel-locked to the pinned Playwright
          Docker image. Regenerate them with npm run test:update:docker, never by hand.
        - A visual test that resizes the viewport or parks the pointer must run last in its file.
          One browser page runs the whole file, so both outlive the test.
        - Coverage is gated at 90% on all four metrics.
    - path: pom.xml
      instructions: |-
        - Build-log noise counts as an error here. frontend-maven-plugin labels everything npm and
          Vite write to stderr as [ERROR], so the filters in ui/.npmrc and vite.config.js must stay
          narrow.
        - Each test suite has its own skip flag: -DskipTests for Java, -DskipJsTests for the UI
          unit tests, -DskipE2eTests for Playwright.
    - path: .github/workflows/**
      instructions: |-
        - Every action is pinned by full commit SHA with a version comment, never a floating tag.
        - Pass github.head_ref and github.base_ref through env, never inline in a run block.
    - path: '**/*.md'
      instructions: |-
        - No em-dashes. American spelling. Active voice, one idea per sentence.
        - README.md is converted to the About page shown inside Polarion. It carries what an
          administrator needs and nothing that concerns only maintainers.
