---
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/lyz-code/yamlfix
    rev: 1.19.1
    hooks:
      - id: yamlfix
        args: [-c, .yamlfix.toml]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: check-xml
      - id: check-json
      - id: check-yaml
      - id: no-commit-to-branch
      - id: mixed-line-ending
  - repo: local
    hooks:
      # React app (ui/) - check-only (block the commit, never modify the tree); run
      # `npm --prefix ui run format`/`lint:fix` to fix.
      - id: ui-prettier
        name: UI Prettier (format:check)
        entry: npm --prefix ui run format:check
        language: system
        pass_filenames: false
        files: ^ui/.*\.(ts|tsx|css|html)$
      - id: ui-eslint
        name: UI ESLint
        entry: npm --prefix ui run lint
        language: system
        pass_filenames: false
        files: ^ui/.*\.(ts|tsx|js|mjs)$
      # Dockerized Vitest (behavior + visual regression) with the 90% coverage gate. Heavy
      # (~30-60s+, needs Docker running); gated on ui/ source changes.
      - id: ui-test-coverage-docker
        name: UI Vitest + coverage gate (Docker)
        entry: npm --prefix ui run test:coverage:docker
        language: system
        pass_filenames: false
        files: ^ui/.*\.(ts|tsx|css)$
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: https://github.com/grigoriev/pre-commit-check-git-user
    rev: v0.9.0
    hooks:
      - id: check-git-config-user-email
        # The fork is maintained outside Intechcore, so its owner's address is accepted too.
        args: [--templates, ^\S+\.\S+@intechcore\.com$, ^grigoriev@fastmail\.com$]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.28.0
    hooks:
      - id: commitizen
